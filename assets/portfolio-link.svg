<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="84" viewBox="0 0 1000 84" role="img" aria-labelledby="title description">
  <title id="title">Open my portfolio</title>
  <desc id="description">Manikant Kumar’s portfolio for AI engineering, full stack development, and blockchain.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#131a21"/>
      <stop offset=".62" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="edge" x2="1" y2="0">
      <stop stop-color="#5287aa"/>
      <stop offset=".52" stop-color="#27313a"/>
      <stop offset="1" stop-color="#416781"/>
    </linearGradient>
    <rect id="outline" x="1.5" y="1.5" width="997" height="81" rx="16.5" pathLength="1"/>
    <filter id="edge-glow" filterUnits="userSpaceOnUse" x="-6" y="-6" width="1012" height="96" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.25"/>
    </filter>
  </defs>
  <style>
    .edge-signal {
      stroke-dasharray: .081 .919;
      stroke-linecap: round;
      animation: trace-edge 10s linear infinite;
    }
    @keyframes trace-edge { from { stroke-dashoffset: -.18; } to { stroke-dashoffset: -1.18; } }
    @media (prefers-reduced-motion: reduce) { .edge-signal { display: none; } }
  </style>
  <use href="#outline" fill="url(#surface)" stroke="url(#edge)"/>
  <g fill="none" stroke="#83cdf6">
    <use href="#outline" stroke-width="2.5" opacity=".42" filter="url(#edge-glow)" class="edge-signal"/>
    <use href="#outline" stroke-width="1.3" class="edge-signal"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="37" fill="#f4f5f6" font-size="33" font-weight="730" letter-spacing="-.55">Open my portfolio</text>
    <text x="33" y="63" fill="#c7ccd1" font-size="21">AI engineering · Full stack · Blockchain</text>
  </g>
  <rect x="927" y="20" width="44" height="44" rx="12" fill="#0c1217" stroke="#426a83"/>
  <path d="M941 50L957 34M945 34H957V46" fill="none" stroke="#b7e4fc" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
