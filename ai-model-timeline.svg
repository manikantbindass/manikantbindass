<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img" aria-labelledby="title desc"><title id="title">AI model timeline — 2020 to November 2026</title><desc id="desc">Selected milestones from GPT-3 to agentic workflows. October 2026: GPT-6.1 Terra, Claude 5.5 family, Gemini 4 Argon and restricted-access Carbon. Sources and access notes in README.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e1d"/><stop offset="1" stop-color="#16132f"/></linearGradient><linearGradient id="accent"><stop stop-color="#40e0ee"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#d18aff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 18;animation:flow 14s linear infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-260}}@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}</style><rect width="1200" height="725" rx="24" fill="url(#bg)"/><rect width="1200" height="725" rx="24" fill="url(#grid)"/><text x="44" y="51" fill="#67e8f9" font-size="13" letter-spacing="3" class="mono">THE EVOLUTION OF INTELLIGENCE</text><text x="44" y="99" fill="#f8fafc" font-size="38" font-weight="700">From language models to working agents.</text><text x="44" y="132" fill="#94a3b8" font-size="17">Selected public milestones · Checked 03 November 2026</text><g><rect x="44" y="169" width="360" height="168" rx="15" fill="#101b30" stroke="#2a3651"/><path d="M62 170H386" stroke="#67e8f9" stroke-opacity=".7"/><circle cx="68" cy="198" r="4" fill="#67e8f9" class="pulse"/><text x="82" y="204" fill="#67e8f9" font-size="22" font-weight="700" class="mono">2020</text><text x="66" y="247" fill="#f1f5f9" font-size="23" font-weight="650">GPT-3</text><text x="66" y="280" fill="#b8c4df" font-size="17">Language models at scale</text><text x="66" y="307" fill="#94a3b8" font-size="15">Few-shot learning</text></g><g><rect x="420" y="169" width="360" height="168" rx="15" fill="#101b30" stroke="#2a3651"/><path d="M438 170H762" stroke="#818cf8" stroke-opacity=".7"/><circle cx="444" cy="198" r="4" fill="#818cf8" class="pulse"/><text x="458" y="204" fill="#818cf8" font-size="22" font-weight="700" class="mono">2022</text><text x="442" y="247" fill="#f1f5f9" font-size="23" font-weight="650">ChatGPT</text><text x="442" y="280" fill="#b8c4df" font-size="17">Conversational AI goes mainstream</text><text x="442" y="307" fill="#94a3b8" font-size="15">A new interface for software</text></g><g><rect x="796" y="169" width="360" height="168" rx="15" fill="#101b30" stroke="#2a3651"/><path d="M814 170H1138" stroke="#c4b5fd" stroke-opacity=".7"/><circle cx="820" cy="198" r="4" fill="#c4b5fd" class="pulse"/><text x="834" y="204" fill="#c4b5fd" font-size="22" font-weight="700" class="mono">2023</text><text x="818" y="247" fill="#f1f5f9" font-size="23" font-weight="650">GPT-4</text><text x="818" y="280" fill="#b8c4df" font-size="17">More capable reasoning</text><text x="818" y="307" fill="#94a3b8" font-size="15">Multimodal input capabilities</text></g><g><rect x="44" y="357" width="360" height="168" rx="15" fill="#101b30" stroke="#2a3651"/><path d="M62 358H386" stroke="#67e8f9" stroke-opacity=".7"/><circle cx="68" cy="386" r="4" fill="#67e8f9" class="pulse"/><text x="82" y="392" fill="#67e8f9" font-size="22" font-weight="700" class="mono">2024</text><text x="66" y="435" fill="#f1f5f9" font-size="23" font-weight="650">GPT-4o · Claude 3</text><text x="66" y="468" fill="#b8c4df" font-size="17">Multimodal assistants</text><text x="66" y="495" fill="#94a3b8" font-size="15">Text, vision and richer interaction</text></g><g><rect x="420" y="357" width="360" height="168" rx="15" fill="#101b30" stroke="#2a3651"/><path d="M438 358H762" stroke="#818cf8" stroke-opacity=".7"/><circle cx="444" cy="386" r="4" fill="#818cf8" class="pulse"/><text x="458" y="392" fill="#818cf8" font-size="22" font-weight="700" class="mono">2025</text><text x="442" y="435" fill="#f1f5f9" font-size="23" font-weight="650">DeepSeek-R1 · GPT-5</text><text x="442" y="468" fill="#b8c4df" font-size="17">Reasoning takes center stage</text><text x="442" y="495" fill="#94a3b8" font-size="15">Open weights and unified systems</text></g><g><rect x="796" y="357" width="360" height="168" rx="15" fill="#101b30" stroke="#2a3651"/><path d="M814 358H1138" stroke="#c4b5fd" stroke-opacity=".7"/><circle cx="820" cy="386" r="4" fill="#c4b5fd" class="pulse"/><text x="834" y="392" fill="#c4b5fd" font-size="22" font-weight="700" class="mono">2026</text><text x="818" y="435" fill="#f1f5f9" font-size="23" font-weight="650">Agents + tool use</text><text x="818" y="468" fill="#b8c4df" font-size="17">From responses to workflows</text><text x="818" y="495" fill="#94a3b8" font-size="15">Coding, computer use and research</text></g><path d="M66 544H1134" stroke="url(#accent)" class="flow" stroke-width="2"/><text x="44" y="583" fill="#67e8f9" font-size="13" letter-spacing="2" class="mono">OCTOBER 2026 / RECENT RELEASES</text><g><text x="44" y="619" fill="#94a3b8" font-size="12" letter-spacing="2" class="mono">OPENAI</text><text x="44" y="651" fill="#e2e8f0" font-size="24" font-weight="650">GPT-6.1 Terra</text><text x="44" y="680" fill="#b8c4df" font-size="15">26 Oct · API / Work / Codex</text></g><g><text x="420" y="619" fill="#94a3b8" font-size="12" letter-spacing="2" class="mono">ANTHROPIC</text><text x="420" y="651" fill="#e2e8f0" font-size="24" font-weight="650">Claude 5.5 family</text><text x="420" y="680" fill="#b8c4df" font-size="15">Opus · Sonnet · Haiku</text></g><g><text x="796" y="619" fill="#94a3b8" font-size="12" letter-spacing="2" class="mono">GOOGLE DEEPMIND</text><text x="796" y="651" fill="#e2e8f0" font