<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-labelledby="title desc"><title id="title">Build with intent. Keep exploring.</title><desc id="desc">Animated flowing circuits and a luminous horizon. Learn how systems work. Build something that matters.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e1d"/><stop offset="1" stop-color="#16132f"/></linearGradient><linearGradient id="accent"><stop stop-color="#40e0ee"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#d18aff"/></linearGradient><radialGradient id="halo"><stop stop-color="#6d5bf5" stop-opacity=".28"/><stop offset="1" stop-color="#6d5bf5" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 18;animation:flow 14s linear infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-260}}@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}</style><rect width="1200" height="245" rx="24" fill="url(#bg)"/><rect width="1200" height="245" rx="24" fill="url(#grid)"/><circle cx="600" cy="310" r="410" fill="url(#halo)"/><path d="M0 195Q300 125 600 195T1200 195V245H0Z" fill="#312e81" opacity=".25"/><path d="M0 210Q300 135 600 210T1200 210" fill="none" stroke="url(#accent)" stroke-width="2" class="flow"/><path d="M0 228Q300 160 600 228T1200 228" fill="none" stroke="#38bdf8" stroke-opacity=".25"/><text x="600" y="57" text-anchor="middle" font-size="12" letter-spacing="4" fill="#67e8f9" class="mono">THE NEXT IDEA STARTS WITH A CONVERSATION</text><text x="600" y="113" text-anchor="middle" font-size="40" font-weight="700" fill="#f8fafc" letter-spacing="-1">Build with intent. Keep exploring.</text><text x="600" y="153" text-anchor="middle" font-size="19" fill="#b8c4df">Learn how systems work. Build something that matters.</text><g class="pulse" fill="#67e8f9"><circle cx="90" cy="86" r="3"/><circle cx="1110" cy="86" r="3"/><circle cx="165" cy="151" r="2"/><circle cx="1035" cy="151" r="2"/></g><path d="M48 42H190M1010 42H1152" stroke="#4c527d"/><path d="M48 42H130M1070 42H1152" stroke="url(#accent)" stroke-width="2" class="flow"/></svg>
