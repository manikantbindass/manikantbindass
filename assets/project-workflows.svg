<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="332" viewBox="0 0 1000 332" role="img" aria-labelledby="title description">
  <title id="title">Three featured project workflows</title>
  <desc id="description">AutoHealOps observes telemetry, flags anomalies, and stages a recovery review. FlowNova AI builds, publishes, and runs workflows. SecureRxChain registers, scans, and verifies batches.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#030609"/>
      <stop offset=".52" stop-color="#090c15"/>
      <stop offset="1" stop-color="#070509"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#e6efff" stop-opacity=".105"/>
      <stop offset=".61" stop-color="#d4dcff" stop-opacity=".027"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".065"/>
    </linearGradient>
    <linearGradient id="node-glass" x2="0" y2="1">
      <stop stop-color="#f6fbff" stop-opacity=".135"/>
      <stop offset=".52" stop-color="#cbd3ec" stop-opacity=".065"/>
      <stop offset="1" stop-color="#cbd3ec" stop-opacity=".025"/>
    </linearGradient>
    <radialGradient id="azure-light">
      <stop stop-color="#3089ff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#3089ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint-light">
      <stop stop-color="#23d597" stop-opacity=".18"/>
      <stop offset="1" stop-color="#23d597" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-light">
      <stop stop-color="#e48250" stop-opacity=".21"/>
      <stop offset="1" stop-color="#e48250" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="270" y="14" width="680" height="22" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#bdc6de" stroke-opacity=".046"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="332" rx="24"/></clipPath>
    <path id="track" d="M280 25H938"/>
  </defs>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .kicker { font-family: Consolas, monospace; font-weight: 700; letter-spacing: .12em; }
    .track { fill: none; stroke: currentColor; stroke-linecap: round; }
    .signal { stroke-dasharray: 90 670; animation: travel 5.6s linear infinite; }
    .second { animation-delay: -1.8s; }
    .third { animation-delay: -3.6s; }
    .band { fill: url(#glass); stroke: currentColor; stroke-opacity: .30; }
    .node { fill: url(#node-glass); stroke: currentColor; stroke-opacity: .4; }
    .step { fill: #eef3ff; font-size: 22px; font-weight: 650; text-anchor: middle; }
    @keyframes travel { from { stroke-dashoffset: 90; } to { stroke-dashoffset: -670; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="332" fill="url(#background)"/>
    <ellipse cx="103" cy="30" rx="442" ry="251" fill="url(#azure-light)"/>
    <ellipse cx="541" cy="185" rx="446" ry="189" fill="url(#mint-light)"/>
    <ellipse cx="924" cy="360" rx="478" ry="224" fill="url(#amber-light)"/>
    <rect width="1000" height="332" fill="url(#grid)"/>
    <rect x=".75" y=".75" width="998.5" height="330.5" rx="23" fill="none" stroke="#d0e2ff" stroke-opacity=".14"/>
    <text x="34" y="49" fill="#d9e4f6" font-size="20" class="kicker">HOW THE PROJECTS WORK</text>
    <g transform="translate(0 105)" color="#8bcbff">
      <rect x="34" y="-30" width="932" height="60" rx="14" class="band"/>
      <circle cx="55" cy="0" r="5" fill="currentColor"/>
      <text x="71" y="8" fill="currentColor" font-size="26" font-weight="700">AutoHealOps</text>
      <use href="#track" class="track" stroke-width="2" opacity=".32"/>
      <use href="#track" class="track signal" stroke-width="5" opacity=".7" filter="url(#glow)"/>
      <use href="#track" class="track signal" stroke-width="2.5"/>
      <rect x="280" y="-20" width="178" height="40" rx="9" class="node"/>
      <rect x="513" y="-20" width="178" height="40" rx="9" class="node"/>
      <rect x="746" y="-20" width="192" height="40" rx="9" class="node"/>
      <text x="369" y="7" class="step">Read telemetry</text>
      <text x="602" y="7" class="step">Flag anomaly</text>
      <text x="842" y="7" class="step">Review recovery</text>
    </g>
    <g transform="translate(0 188)" color="#92f2c4">
      <rect x="34" y="-30" width="932" height="60" rx="14" class="band"/>
      <circle cx="55" cy="0" r="5" fill="currentColor"/>
      <text x="71" y="8" fill="currentColor" font-size="26" font-weight="700">FlowNova AI</text>
      <use href="#track" class="track" stroke-width="2" opacity=".32"/>
      <use href="#track" class="track signal second" stroke-width="5" opacity=".7" filter="url(#glow)"/>
      <use href="#track" class="track signal second" stroke-width="2.5"/>
      <rect x="280" y="-20" width="178" height="40" rx="9" class="node"/>
      <rect x="513" y="-20" width="178" height="40" rx="9" class="node"/>
      <rect x="746" y="-20" width="192" height="40" rx="9" class="node"/>
      <text x="369" y="7" class="step">Build workflow</text>
      <text x="602" y="7" class="step">Publish version</text>
      <text x="842" y="7" class="step">Run &amp; inspect</text>
    </g>
    <g transform="translate(0 271)" color="#ffc497">
      <rect x="34" y="-30" width="932" height="60" rx="14" class="band"/>
      <circle cx="55" cy="0" r="5" fill="currentColor"/>
      <text x="71" y="8" fill="currentColor" font-size="26" font-weight="700">SecureRxChain</text>
      <use href="#track" class="track" stroke-width="2" opacity=".32"/>
      <use href="#track" class="track signal third" stroke-width="5" opacity=".7" filter="url(#glow)"/>
      <use href="#track" class="track signal third" stroke-width="2.5"/>
      <rect x="280" y="-20" width="178" height="40" rx="9" class="node"/>
      <rect x="513" y="-20" width="178" height="40" rx="9" class="node"/>
      <rect x="746" y="-20" width="192" height="40" rx="9" class="node"/>
      <text x="369" y="7" class="step">Register batch</text>
      <text x="602" y="7" class="step">Scan QR code</text>
      <text x="842" y="7" class="step">Verify batch</text>
    </g>
  </g>
</svg>
