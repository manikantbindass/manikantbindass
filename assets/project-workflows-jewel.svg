<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="305" viewBox="0 0 1000 305" role="img" aria-labelledby="title description">
  <title id="title">Three featured project workflows</title>
  <desc id="description">Follow the animated signals from left to right. AutoHealOps reads telemetry, flags anomalies and reviews recovery. FlowNova AI builds, publishes and runs a workflow. SecureRxChain registers, scans and verifies a batch.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#180e1c"/>
      <stop offset=".52" stop-color="#100e16"/>
      <stop offset="1" stop-color="#0b1314"/>
    </linearGradient>
    <radialGradient id="plum-light">
      <stop stop-color="#743359" stop-opacity=".35"/>
      <stop offset="1" stop-color="#743359" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jade-light">
      <stop stop-color="#2b6557" stop-opacity=".29"/>
      <stop offset="1" stop-color="#2b6557" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x2="1" y2="1">
      <stop stop-color="#e3b99b"/>
      <stop offset=".49" stop-color="#807080"/>
      <stop offset="1" stop-color="#91cbb6"/>
    </linearGradient>
    <linearGradient id="sapphire-glass" x2="1" y2="1">
      <stop stop-color="#293d54"/>
      <stop offset="1" stop-color="#172438"/>
    </linearGradient>
    <linearGradient id="amethyst-glass" x2="1" y2="1">
      <stop stop-color="#3b2b4c"/>
      <stop offset="1" stop-color="#241a32"/>
    </linearGradient>
    <linearGradient id="copper-glass" x2="1" y2="1">
      <stop stop-color="#462f2a"/>
      <stop offset="1" stop-color="#2a1c23"/>
    </linearGradient>
    <linearGradient id="step-glass" x2="0" y2="1">
      <stop stop-color="#fff4e9" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff4e9" stop-opacity=".023"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#eedacb" stroke-opacity=".044"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="305" rx="25"/></clipPath>
    <filter id="glow" filterUnits="userSpaceOnUse" x="271" y="16" width="676" height="16" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <rect id="lane" x="34" y="-31" width="932" height="62" rx="15"/>
    <g id="steps" fill="url(#step-glass)" stroke="currentColor" stroke-opacity=".44">
      <rect x="278" y="-23" width="182" height="40" rx="10"/>
      <rect x="510" y="-23" width="182" height="40" rx="10"/>
      <rect x="742" y="-23" width="194" height="40" rx="10"/>
    </g>
    <path id="track" d="M278 24H936" pathLength="1"/>
    <path id="arrow" d="M-7 0H6M1-5l5 5-5 5"/>
  </defs>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .lane { stroke: currentColor; stroke-opacity: .32; }
    .track, .flow, .arrow { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .project { font-size: 24px; font-weight: 720; }
    .step-label { fill: #fff5ee; font-size: 21px; font-weight: 650; text-anchor: middle; }
    .flow { stroke-dasharray: .095 .905; animation: travel 6.3s linear var(--phase) infinite; }
    .arrow { opacity: .5; }
    .first { animation: first-relay 6.3s linear var(--phase) infinite; }
    .second { animation: second-relay 6.3s linear var(--phase) infinite; }
    @keyframes travel { from { stroke-dashoffset: .095; } to { stroke-dashoffset: -.905; } }
    @keyframes first-relay { 0%, 21%, 44%, 100% { opacity: .46; } 32% { opacity: 1; } }
    @keyframes second-relay { 0%, 55%, 80%, 100% { opacity: .46; } 67% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .arrow { animation: none; }
      .flow { display: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="305" fill="url(#background)"/>
    <ellipse cx="103" cy="29" rx="452" ry="215" fill="url(#plum-light)"/>
    <ellipse cx="913" cy="277" rx="452" ry="235" fill="url(#jade-light)"/>
    <rect width="1000" height="305" fill="url(#grid)"/>
    <rect x=".75" y=".75" width="998.5" height="303.5" rx="24" fill="none" stroke="url(#rim)" stroke-opacity=".31"/>
    <text x="34" y="47" fill="#fff3e5" font-size="30" font-weight="740" letter-spacing="-.4">How the projects work</text>
    <g transform="translate(0 98)" color="#afceff" style="--phase:0s">
      <use href="#lane" fill="url(#sapphire-glass)" class="lane"/>
      <path d="M50-30H246" fill="none" stroke="currentColor" stroke-opacity=".23" stroke-linecap="round"/>
      <g transform="translate(50 -11)" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M1 11h4l3-6 4 12 4-8 3 2h4"/></g>
      <text x="82" y="8" fill="currentColor" class="project">AutoHealOps</text>
      <use href="#steps"/>
      <text x="369" y="5" class="step-label">Read telemetry</text>
      <text x="601" y="5" class="step-label">Flag anomaly</text>
      <text x="839" y="5" class="step-label">Review recovery</text>
      <use href="#arrow" x="485" y="-3" stroke-width="1.55" class="arrow first"/>
      <use href="#arrow" x="717" y="-3" stroke-width="1.55" class="arrow second"/>
      <use href="#track" stroke-width="1.2" opacity=".31" class="track"/>
      <use href="#track" stroke-width="4.1" opacity=".52" filter="url(#glow)" class="flow"/>
      <use href="#track" stroke-width="2.2" class="flow"/>
    </g>
    <g transform="translate(0 175)" color="#dfbdff" style="--phase:-2.1s">
      <use href="#lane" fill="url(#amethyst-glass)" class="lane"/>
      <path d="M50-30H246" fill="none" stroke="currentColor" stroke-opacity=".23" stroke-linecap="round"/>
      <g transform="translate(50 -11)" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h6l7-6m-7 6 7 6"/><circle cx="3" cy="11" r="2"/><circle cx="20" cy="4" r="2"/><circle cx="20" cy="18" r="2"/></g>
      <text x="82" y="8" fill="currentColor" class="project">FlowNova AI</text>
      <use href="#steps"/>
      <text x="369" y="5" class="step-label">Build workflow</text>
      <text x="601" y="5" class="step-label">Publish version</text>
      <text x="839" y="5" class="step-label">Run &amp; inspect</text>
      <use href="#arrow" x="485" y="-3" stroke-width="1.55" class="arrow first"/>
      <use href="#arrow" x="717" y="-3" stroke-width="1.55" class="arrow second"/>
      <use href="#track" stroke-width="1.2" opacity=".31" class="track"/>
      <use href="#track" stroke-width="4.1" opacity=".52" filter="url(#glow)" class="flow"/>
      <use href="#track" stroke-width="2.2" class="flow"/>
    </g>
    <g transform="translate(0 252)" color="#ffc39a" style="--phase:-4.2s">
      <use href="#lane" fill="url(#copper-glass)" class="lane"/>
      <path d="M50-30H246" fill="none" stroke="currentColor" stroke-opacity=".23" stroke-linecap="round"/>
      <g transform="translate(50 -11)" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5v9l-10 5-10-5V7zM2 7l10 5 10-5m-10 5v9"/></g>
      <text x="82" y="8" fill="currentColor" class="project">SecureRxChain</text>
      <use href="#steps"/>
      <text x="369" y="5" class="step-label">Register batch</text>
      <text x="601" y="5" class="step-label">Scan QR code</text>
      <text x="839" y="5" class="step-label">Verify batch</text>
      <use href="#arrow" x="485" y="-3" stroke-width="1.55" class="arrow first"/>
      <use href="#arrow" x="717" y="-3" stroke-width="1.55" class="arrow second"/>
      <use href="#track" stroke-width="1.2" opacity=".31" class="track"/>
      <use href="#track" stroke-width="4.1" opacity=".52" filter="url(#glow)" class="flow"/>
      <use href="#track" stroke-width="2.2" class="flow"/>
    </g>
  </g>
</svg>
